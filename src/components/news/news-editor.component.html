<div class="max-w-7xl pb-10">
  <div class="flex items-center gap-4 mb-6">
    <a routerLink="/news" class="p-2 rounded-full hover:bg-slate-200 text-[#083594] hover:text-[#062a71] transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1 class="text-2xl font-bold text-slate-800">{{ isEditing() ? 'Edit Article' : 'Add New Article' }}</h1>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <div class="lg:col-span-2 space-y-6">
      
      <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Title</label>
          <input formControlName="title" type="text" class="w-full border-slate-300 rounded-lg shadow-sm focus:ring-[#083594]-500 focus:border-[#083594]-500 p-2.5 border text-lg font-medium">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Excerpt</label>
          <app-rich-text-editor formControlName="excerpt" height="120px" placeholder="Short summary..."></app-rich-text-editor>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Full Content</label>
          <app-rich-text-editor formControlName="content" height="400px" placeholder="Write your article..."></app-rich-text-editor>
        </div>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="space-y-6">
       <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
         <h3 class="text-base font-bold text-slate-800 mb-4 border-b pb-2">Publish</h3>
         
         <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1">Publish Date</label>
            <input formControlName="publishedDate" type="datetime-local" class="w-full border-slate-300 rounded-lg shadow-sm focus:ring-[#083594]-500 focus:border-[#083594]-500 p-2.5 border">
         </div>

         <div class="space-y-4 mb-6 pt-2 border-t border-slate-100">
            <div class="flex items-center justify-between">
               <span class="text-sm font-medium text-slate-700">Published</span>
               <label class="relative inline-flex items-center cursor-pointer">
                 <input type="checkbox" formControlName="isPublished" class="sr-only peer">
                 <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-green-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-600"></div>
               </label>
            </div>
            
            <div class="flex items-center justify-between">
               <span class="text-sm font-medium text-slate-700">Feature Article</span>
               <label class="relative inline-flex items-center cursor-pointer">
                 <input type="checkbox" formControlName="isFeatured" class="sr-only peer">
                 <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-[#083594]-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#083594]"></div>
               </label>
            </div>
            
            <div class="flex items-center justify-between">
               <span class="text-sm font-medium text-slate-700">Show as Banner</span>
               <label class="relative inline-flex items-center cursor-pointer">
                 <input type="checkbox" formControlName="isNewsPageBanner" class="sr-only peer">
                 <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-[#083594]-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#083594]"></div>
               </label>
            </div>
         </div>

         <button type="submit" [disabled]="isUploading()" class="w-full flex justify-center py-2.5 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-[#083594] hover:bg-[#062a71] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#083594]-500 shadow-sm disabled:opacity-50 transition-colors">
            {{ isEditing() ? 'Update Article' : 'Publish Article' }}
         </button>
       </div>

      <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
         <h3 class="text-base font-bold text-slate-800 mb-2">Meta</h3>
         
         <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Author</label>
            <input formControlName="author" type="text" class="w-full border-slate-300 rounded-lg shadow-sm focus:ring-[#083594]-500 focus:border-[#083594]-500 p-2.5 border">
         </div>
         
         <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Category</label>
            <select formControlName="category" class="w-full border-slate-300 rounded-lg shadow-sm focus:ring-[#083594]-500 focus:border-[#083594]-500 p-2.5 border bg-white">
              <option value="" disabled>Select a category</option>
              @for (category of availableCategories(); track category.id) {
                <option [value]="category.name">{{ category.name }}</option>
              }
            </select>
            @if (newsCategories().length === 0) {
              <p class="text-xs text-slate-500 mt-2">No news categories found. Add them in Settings > News Categories.</p>
            }
         </div>
      </div>

      <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
         <h3 class="text-base font-bold text-slate-800 mb-4">Featured Image</h3>
         <div class="space-y-4">
            <div class="aspect-video w-full rounded-lg bg-slate-50 border border-slate-200 flex items-center justify-center relative overflow-hidden bg-center bg-no-repeat" style="background-image: url('https://i.ibb.co/nNsGtRqn/placeholder-80x80.png'); background-size: 48px;">
               @if (form.get('imageUrl')?.value) {
                  <img [src]="form.get('imageUrl')?.value" class="w-full h-full object-cover bg-white" onerror="this.style.display='none'">
               }
               @if (isUploading()) {
                  <div class="absolute inset-0 bg-white/80 flex items-center justify-center">
                     <span class="animate-spin w-6 h-6 border-2 border-[#083594] border-t-transparent rounded-full"></span>
                  </div>
               }
            </div>
            <div class="flex gap-2">
               <input formControlName="imageUrl" type="text" class="flex-1 min-w-0 border-slate-300 rounded-lg text-xs p-2 border" placeholder="https://...">
               <label class="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-2 rounded-lg border border-slate-200">
                  <span class="sr-only">Upload</span>
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                  <input type="file" (change)="onFileSelected($event)" accept="image/*" class="sr-only">
               </label>
            </div>
         </div>
      </div>

    </div>
  </form>
</div>
