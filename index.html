    <style>
      html { font-size: 14.5px; }
      body { font-family: 'Inter', sans-serif; }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

      /* Utility to hide scrollbar but allow scrolling */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
      
      /* Quill Overrides for Tailwind conflict or aesthetics */
      .ql-toolbar {
        border-top-left-radius: 0.75rem;
        border-top-right-radius: 0.75rem;
        border-color: #e2e8f0 !important;
        background-color: #f8fafc;
        flex-shrink: 0; /* Prevent toolbar shrinking */
      }
      .ql-container {
        border-bottom-left-radius: 0.75rem;
        border-bottom-right-radius: 0.75rem;
        border-color: #e2e8f0 !important;
        font-family: 'Inter', sans-serif !important;
        font-size: 0.875rem !important; /* 14px */
        /* Flex setup to fill parent */
        display: flex;
        flex-direction: column;
        flex: 1;
        overflow: hidden;
      }
      .ql-editor {
        /* Remove fixed min-height, allow flex growth */
        flex: 1;
        overflow-y: auto;
        height: 100%;
      }
    </style>
