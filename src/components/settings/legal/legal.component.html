<div>
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
    <div>
        <h3 class="text-lg font-bold text-slate-700">{{ title() }}</h3>
        <p class="text-sm text-slate-500">Edit the {{ title() | lowercase }} content for the application.</p>
    </div>
    @if (lastUpdated()) {
        <div class="text-right">
            <p class="text-xs text-slate-400">Last updated: {{ lastUpdated() | date:'medium' }}</p>
            @if (updatedBy()) {
                <p class="text-xs text-slate-400">By: {{ updatedBy() }}</p>
            }
        </div>
    }
  </div>

  <form [formGroup]="form" (ngSubmit)="save()">
    <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-slate-200">
        <!-- Toolbar Actions -->
        <div class="bg-slate-50 border-b border-slate-200 px-4 py-2 flex justify-end">
             <button type="button" (click)="toggleSource()" class="text-xs font-medium px-3 py-1.5 rounded border transition-colors flex items-center gap-2"
                [class.bg-slate-200]="showSource()"
                [class.text-slate-800]="showSource()"
                [class.border-slate-300]="showSource()"
                [class.bg-white]="!showSource()"
                [class.text-slate-600]="!showSource()"
                [class.border-slate-200]="!showSource()">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                {{ showSource() ? 'Switch to Visual Editor' : 'Edit HTML Source' }}
             </button>
        </div>

        <!-- Visual Editor -->
        <div [class.hidden]="showSource()" class="resize-y overflow-hidden h-[500px] flex flex-col">
           <div #editorContainer class="bg-white flex-1 overflow-hidden"></div>
        </div>
        
        <!-- Source Editor -->
        <div [class.hidden]="!showSource()">
            <textarea 
                formControlName="content" 
                class="w-full h-[500px] p-4 font-mono text-sm text-slate-700 bg-slate-50 focus:outline-none resize-y"
                placeholder="Paste raw HTML here..."></textarea>
        </div>
    </div>

    <div class="mt-6 flex justify-end">
        <button type="submit" [disabled]="isSaving()" class="bg-[#083594] hover:bg-[#062a71] text-white px-6 py-2.5 rounded-lg font-medium transition-colors shadow-sm disabled:opacity-50 flex items-center gap-2">
            @if (isSaving()) {
                <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            }
            Save Changes
        </button>
    </div>
  </form>
</div>
