    <app-modal [title]="isEditing() ? 'Edit Category' : 'Add New Category'" (close)="close.emit()">
      <div body>
        <form [formGroup]="form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Category Name</label>
            <input formControlName="name" type="text" placeholder="e.g. Restaurants" class="w-full border-slate-300 rounded-lg focus:ring-[#083594] focus:border-[#083594] p-2.5 border">
          </div>
        </form>
      </div>
      <div footer class="flex gap-3">
         <button (click)="save()" [disabled]="form.invalid || isSaving()" class="flex items-center justify-center gap-2 rounded-lg bg-[#083594] px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-[#062a71] disabled:cursor-not-allowed disabled:opacity-50">
            @if (isSaving()) { <span class="animate-spin w-4 h-4 border-2 border-white border-t-transparent rounded-full"></span> }
            @else { {{ isEditing() ? 'Update' : 'Create' }} }
         </button>
         <button (click)="close.emit()" class="flex items-center justify-center gap-2 rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold text-slate-600 transition-colors hover:bg-slate-50">Cancel</button>
      </div>
    </app-modal>
