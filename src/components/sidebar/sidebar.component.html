<div class="flex flex-col h-full bg-slate-900 text-white">
  <div class="p-6 border-b border-slate-800 flex items-center gap-3 shrink-0">
    <img src="https://i.ibb.co/pBdzCDQd/196.png" alt="CeyHallo" class="w-10 h-10 rounded-lg object-contain shrink-0 shadow-lg border border-slate-700">
    <h1 class="text-xl font-bold tracking-tight whitespace-nowrap overflow-hidden transition-opacity duration-300" [class.opacity-0]="!isSidebarOpen() && !isMobile()">CeyHallo Admin</h1>
  </div>

  <nav class="flex-1 p-4 space-y-2 overflow-y-auto no-scrollbar">
    @for (link of navLinks; track link.path) {
      <a routerLink="{{link.path}}" routerLinkActive="bg-slate-800 text-[#FFD700]" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition-colors group">
        <span class="material-icons text-inherit shrink-0" style="font-size: 20px;">{{link.matIcon}}</span>
        <span class="font-medium whitespace-nowrap">{{link.label}}</span>
      </a>
    }
  </nav>

  <div class="p-4 border-t border-slate-800 shrink-0">
    <div class="flex items-center justify-between px-4 py-2 hover:bg-slate-800 rounded transition-colors group">
      <div class="flex items-center gap-3 overflow-hidden">
         <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs bg-purple-600 shrink-0">
        {{ currentUser()?.role?.[0]?.toUpperCase() || 'ADMIN' }}
         </div>
         <div class="whitespace-nowrap overflow-hidden transition-opacity duration-300" [class.opacity-0]="!isSidebarOpen() && !isMobile()">
           <p class="text-sm font-medium">{{ currentUser()?.name }}</p>
           <p class="text-xs text-slate-300">{{ currentUser()?.role || 'Administrator' }}</p>
         </div>
      </div>
      <button (click)="onLogout()" class="text-slate-300 hover:text-white p-2 rounded-lg transition-colors" title="Sign Out">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </div>
</div>
